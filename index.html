<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title data-variable="TITLE"></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Lora:ital,wght@0,400;1,400&family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/moracarta/assets/favicon-BHE0iE5r.png">
  <meta name="google-site-verification" content="mJ_GU1NHusA1bbYXe-iRJuEZCi1q7NJ99jr42fF0Yuc" />
  <script type="module" crossorigin src="/moracarta/assets/main-CrvjkThw.js"></script>
  <link rel="modulepreload" crossorigin href="/moracarta/assets/templateBinding-BLZMp-A8.js">
  <link rel="stylesheet" crossorigin href="/moracarta/assets/main-gJgnUtPq.css">
</head>
<body>
  <div class="header">
    <div class="header-ornament" style="color: #d4af37; text-shadow: 0 1px 3px rgba(0,0,0,0.3);">❧ ❦ ☙</div>
    
    <!-- Título más grande (cambiamos a 42px y añadimos estilo directo) -->
    <h1 data-variable="TITLE" style="font-size: 42px !important; color: #fff0f0 !important;"></h1>
    
    <div class="header-line" style="background: linear-gradient(to right, transparent, #d4af37, transparent); height: 2px;"></div>
    
    <!-- Cita corregida (guarda) y con clase para agrandarla -->
    <p class="header-sub love-note" data-variable="TEXT_TOP" style="font-size: 22px !important; color: #ffcccc !important; line-height: 1.6;">Cada carta expresa solo una miniscula parte de todo lo mucho que siento por ti.</p>
  </div>

  <div class="letter-list" id="letter-list"></div>

  <div class="bottom-text">
    <div class="bottom-text-line"></div>
    <p data-variable="TEXT_BOTTOM"></p>
    <p data-variable="Aldair"></p>
  </div>

  <footer class="footer">
  </footer>
  
  
  <!-- Forzar el fondo rojo suave de Karly por encima de los scripts de la plantilla -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.style.setProperty("background-color", "#5f1c21", "important");
      document.body.style.setProperty("background-image", "radial-gradient(ellipse at 20% 10%, #7a3b40 0%, transparent 50%), radial-gradient(ellipse at 80% 90%, #3d1a1d 0%, transparent 50%)", "important");
    });
  </script>
</body>
</html>
